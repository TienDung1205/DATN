services:
  backend:
    build:
      context: ./backend
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-102400}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DATABASE_TIMEOUT_MS: ${DATABASE_TIMEOUT_MS:-5000}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-30}
      USER_ACCESS_TOKEN_SECRET: ${USER_ACCESS_TOKEN_SECRET:?Set USER_ACCESS_TOKEN_SECRET in .env}
      AUTH_ISSUER: ${AUTH_ISSUER:-bookstore-api}
      USER_ACCESS_TOKEN_TTL_SECONDS: ${USER_ACCESS_TOKEN_TTL_SECONDS:-900}
      USER_REFRESH_TOKEN_TTL_SECONDS: ${USER_REFRESH_TOKEN_TTL_SECONDS:-604800}
      AUTH_REFRESH_RATE_LIMIT: ${AUTH_REFRESH_RATE_LIMIT:-60}
      USER_COOKIE_SECURE: ${USER_COOKIE_SECURE:-false}
      ADMIN_ACCESS_TOKEN_SECRET: ${ADMIN_ACCESS_TOKEN_SECRET:?Set ADMIN_ACCESS_TOKEN_SECRET in .env}
      ADMIN_ACCESS_TOKEN_TTL_SECONDS: ${ADMIN_ACCESS_TOKEN_TTL_SECONDS:-900}
      ADMIN_REFRESH_TOKEN_TTL_SECONDS: ${ADMIN_REFRESH_TOKEN_TTL_SECONDS:-604800}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_LOGIN_RATE_LIMIT: ${ADMIN_LOGIN_RATE_LIMIT:-20}
      ADMIN_REFRESH_RATE_LIMIT: ${ADMIN_REFRESH_RATE_LIMIT:-60}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.BACKEND_PORT + '/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    build:
      context: ./backend
      target: migrate
    init: true
    restart: "no"
    command: ["sh", "-c", "npm run db:deploy && npm run admin:seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_FULL_NAME: ${SEED_ADMIN_FULL_NAME:-}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
